<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Almanac">
<meta name="theme-color" content="#FFFFFF">
<title>Almanac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icons/favicon-16.png?v=4" type="image/png" sizes="16x16">
<link rel="icon" href="/static/icons/favicon-24.png?v=4" type="image/png" sizes="24x24">
<link rel="icon" href="/static/icons/favicon-32.png?v=4" type="image/png" sizes="32x32">
<link rel="icon" href="/static/icons/favicon-48.png?v=4" type="image/png" sizes="48x48">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="/static/manifest.webmanifest?v=2">
</head>
<body>
<nav id="side" aria-label="Almanac">
  <div class="brand"><span class="mark">A</span>Almanac</div>
  <a href="#chat" class="ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Ask Almanac…</span></a>
  <div class="group">
    <a href="#today" data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></a>
    <a href="#chat" data-view="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span><i class="dot" data-badge="chat" hidden></i></a>
    <a href="#inbox" data-view="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg><span>Suggestions</span><i class="count" data-badge="inbox" hidden></i></a>
    <a href="#calendar" data-view="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Calendar</span></a>
    <a href="#record" data-view="record"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Record</span></a>
    <a href="#goals" data-view="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>Goals</span></a>
  </div>
  <div class="group courses">
    <div class="label">Courses</div>
    <div id="course-links"></div>
  </div>
  <div class="grow"></div>
  <div class="group minor">
    <a href="#plan" data-view="plan">Plan</a>
    <a href="#memory" data-view="memory">What I remember</a>
    <a href="#archive" data-view="archive">Reviews</a>
    <a href="#settings" data-view="settings">Settings</a>
  </div>
</nav>

<div id="timer" hidden></div>
<main id="view"></main>

<nav id="tabs" aria-label="Almanac">
  <a href="#today" data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</a>
  <a href="#chat" data-view="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat<i class="dot" data-badge="chat" hidden></i></a>
  <a href="#calendar" data-view="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar</a>
  <a href="#goals" data-view="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</a>
  <button type="button" class="more" aria-expanded="false" onclick="toggleSheet()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>More<i class="dot" data-badge="inbox-dot" hidden></i></button>
</nav>
<div id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-label="More">
    <a href="#inbox" data-view="inbox">Suggestions <i class="count" data-badge="inbox" hidden></i></a>
    <a href="#record" data-view="record">Record a lecture</a>
    <div id="sheet-courses"></div>
    <a href="#plan" data-view="plan">Plan</a>
    <a href="#memory" data-view="memory">What I remember</a>
    <a href="#archive" data-view="archive">Reviews</a>
    <a href="#settings" data-view="settings">Settings</a>
  </div>
</div>

<dialog id="editor"></dialog>
<div id="toast" role="status" hidden onclick="this.hidden = true"></div>
<script src="/static/app.js"></script>
<script src="/static/record.js"></script>
</body>
</html>
